name: AI Review Trigger

# Does nothing itself: finishing lets ai-review.yml (on workflow_run) start
# when a status label is added. This runs with the PR's own copy of this file,
# so ai-review.yml trusts nothing about this run and re-checks everything.
# Label changes made by workflows through GITHUB_TOKEN never start this.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  trigger:
    if: ${{ startsWith(github.event.label.name, 'status:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Request an AI review
        env:
          LABEL: ${{ github.event.label.name }}
        run: 'echo "label added: $LABEL"'
