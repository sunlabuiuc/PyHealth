name: PR Contribution Rules

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  contribution-rules:
    runs-on: ubuntu-latest
    steps:
      # The PR head, with full history: line numbers must match the head and
      # the merge base with master must be reachable.
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch the PR base
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install 'ruff~=0.15'

      - name: Check PR contribution rules
        run: |
          python tools/check_pr_rules.py \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}
