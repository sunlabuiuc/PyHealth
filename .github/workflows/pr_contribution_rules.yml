name: PR Contribution Rules

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  contribution-rules:
    runs-on: ubuntu-latest
    steps:
      # GitHub's test merge of the PR into master, with full history. Its first
      # parent (HEAD^1) is the master it merged into, so the diff is the PR's
      # own changes and line numbers match the files. tools/check_pr_rules.py
      # is master's copy, not the PR branch's, which may predate fixes to it.
      - name: Checkout the test merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install 'ruff~=0.15'

      - name: Check PR contribution rules
        run: |
          python tools/check_pr_rules.py \
            --base HEAD^1 \
            --head HEAD
