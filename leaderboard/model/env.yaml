# ==============================================================================
# PyHealth model benchmark environment: machine-specific settings only.
# Moving to another machine changes this file, never the task files.
# ==============================================================================
version: "1.0"

compute:
  device: "cuda:0"     # "cuda:N", "cpu" or "mps"
  cpu_threads: 16      # bounds torch, Polars, OpenMP and MKL threads

paths:
  # Dataset preprocessing cache (each dataset config gets its own subdirectory).
  cache_dir: "/srv/local/pyhealth-benchmarks/model/cache"
  # Per <task id>/<model id>/: result.json (with the model version) and seed<N>/
  # logs and checkpoints of the last run. A pair reruns when the version in its
  # result.json differs from the task file's.
  output_dir: "/srv/local/pyhealth-benchmarks/model/output"

# true limits every dataset to 1000 patients for quick debugging; dev results
# go under <output_dir>/dev/ so they never count as full runs.
dev: false
