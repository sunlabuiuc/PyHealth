# Synthea FHIR R4 Bulk Data (NDJSON) ingest configuration.

version: "synthea_fhir_r4"

glob_patterns:
  - "**/*.ndjson"
  - "**/*.ndjson.gz"

resource_specs:
  Patient:
    table: patient
    columns:
      patient_id:        {locate: ["id"], required: true}
      resource_id:       {locate: ["id"]}
      birth_date:        {locate: ["birthDate"]}
      gender:            {locate: ["gender"]}
      deceased_boolean:  {locate: ["deceasedBoolean"], transform: bool_norm}
      deceased_datetime: {locate: ["deceasedDateTime"]}

  Encounter:
    table: encounter
    columns:
      patient_id:      {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id:     {locate: ["id"]}
      encounter_id:    {locate: ["id"]}
      event_time:      {locate: ["period.start"]}
      encounter_class: {locate: ["class.code"]}
      encounter_end:   {locate: ["period.end"]}

  Condition:
    table: condition
    columns:
      patient_id:   {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id:  {locate: ["id"]}
      encounter_id: {locate: ["encounter.reference"], transform: ref_id}
      event_time:   {locate: ["onsetDateTime", "onsetPeriod.start", "recordedDate"]}
      concept_key:  {locate: ["code"], transform: coding_key}

  Observation:
    table: observation
    columns:
      patient_id:   {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id:  {locate: ["id"]}
      encounter_id: {locate: ["encounter.reference"], transform: ref_id}
      event_time:   {locate: ["effectiveDateTime", "effectivePeriod.start", "issued"]}
      concept_key:  {locate: ["code"], transform: coding_key}

  MedicationRequest:
    table: medication_request
    columns:
      patient_id:   {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id:  {locate: ["id"]}
      encounter_id: {locate: ["encounter.reference"], transform: ref_id}
      event_time:   {locate: ["authoredOn"]}
      concept_key:  {locate: ["medicationCodeableConcept", "medicationReference"], transform: med_concept}

  Procedure:
    table: procedure
    columns:
      patient_id:   {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id:  {locate: ["id"]}
      encounter_id: {locate: ["encounter.reference"], transform: ref_id}
      event_time:   {locate: ["performedDateTime", "performedPeriod.start", "recordedDate"]}
      concept_key:  {locate: ["code"], transform: coding_key}

  AllergyIntolerance:
    table: allergy_intolerance
    columns:
      patient_id:  {locate: ["patient.reference"], transform: ref_id, required: true}
      resource_id: {locate: ["id"]}
      event_time:  {locate: ["onsetDateTime", "recordedDate"]}
      concept_key: {locate: ["code"], transform: coding_key}

  Immunization:
    table: immunization
    columns:
      patient_id:   {locate: ["patient.reference"], transform: ref_id, required: true}
      resource_id:  {locate: ["id"]}
      encounter_id: {locate: ["encounter.reference"], transform: ref_id}
      event_time:   {locate: ["occurrenceDateTime"]}
      concept_key:  {locate: ["vaccineCode"], transform: coding_key}

  CarePlan:
    table: care_plan
    columns:
      patient_id:  {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id: {locate: ["id"]}
      event_time:  {locate: ["period.start", "created"]}
      concept_key: {locate: ["category"], transform: coding_key_list}

  Device:
    table: device
    columns:
      patient_id:  {locate: ["patient.reference"], transform: ref_id, required: true}
      resource_id: {locate: ["id"]}
      event_time:  {locate: ["manufactureDate"]}
      concept_key: {locate: ["type"], transform: coding_key}

  ImagingStudy:
    table: imaging_study
    columns:
      patient_id:  {locate: ["subject.reference"], transform: ref_id, required: true}
      resource_id: {locate: ["id"]}
      event_time:  {locate: ["started"]}
      concept_key: {locate: ["procedureCode"], transform: coding_key_list}

  SupplyDelivery:
    table: supply_delivery
    columns:
      patient_id:  {locate: ["patient.reference"], transform: ref_id, required: true}
      resource_id: {locate: ["id"]}
      event_time:  {locate: ["occurrenceDateTime", "occurrencePeriod.start"]}
      concept_key: {locate: ["suppliedItem.itemCodeableConcept"], transform: coding_key}

tables:
  patient:
    file_path: "patient.parquet"
    patient_id: "patient_id"
    timestamp: "birth_date"
    attributes: ["resource_id", "birth_date", "gender", "deceased_boolean", "deceased_datetime"]

  encounter:
    file_path: "encounter.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "encounter_id", "event_time", "encounter_class", "encounter_end"]

  condition:
    file_path: "condition.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "encounter_id", "event_time", "concept_key"]

  observation:
    file_path: "observation.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "encounter_id", "event_time", "concept_key"]

  medication_request:
    file_path: "medication_request.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "encounter_id", "event_time", "concept_key"]

  procedure:
    file_path: "procedure.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "encounter_id", "event_time", "concept_key"]

  allergy_intolerance:
    file_path: "allergy_intolerance.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "event_time", "concept_key"]

  immunization:
    file_path: "immunization.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "encounter_id", "event_time", "concept_key"]

  care_plan:
    file_path: "care_plan.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "event_time", "concept_key"]

  device:
    file_path: "device.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "event_time", "concept_key"]

  imaging_study:
    file_path: "imaging_study.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "event_time", "concept_key"]

  supply_delivery:
    file_path: "supply_delivery.parquet"
    patient_id: "patient_id"
    timestamp: "event_time"
    attributes: ["resource_id", "event_time", "concept_key"]
