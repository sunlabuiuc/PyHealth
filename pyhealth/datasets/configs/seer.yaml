version: "2.0"
tables:
  tumor:
    file_path: "seer_export.txt"
    patient_id: "patient_key"
    timestamp: null
    attributes:
      - record_number
      - diagnosis_year
      - site_recode
      - primary_site
      - sex
      - age_group
      - histology
      - grade
      - stage
      - laterality
      - marital_status
      - tumor_size
      - extension
      - lymph_nodes
      - metastases
      - survival_months
      - cause_of_death
