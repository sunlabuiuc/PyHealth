# Settings for examples/autoimprove_agentic_synthetic_mimic3.py. Before the
# first round the LLM asks a question of the training data; then it picks
# configs (a model round) and writes its own models (a code round); after them
# it writes a new evaluation, which may become a guardrail.
search:
  metric: roc_auc
  plan: [model, code]
  proposals_per_round: 2
budget:
  rounds: 2                   # one model round, one code round
  patience: 2
baseline:
  model: RNN
  model_params: {hidden_dim: 128}
  train_params: {epochs: 5}
proposer:
  type: llm
  backend: claude
evaluation:
  cv_folds: 3                 # guardrails compare trials fold by fold
analysis:
  enabled: true
  every: 2                    # before rounds 1, 3, ...
guardrails:
  enabled: true
  every: 2                    # after rounds 2, 4, ...
code:
  timeout: 900                # seconds per training of generated code
