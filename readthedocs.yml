version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
    configuration: docs/conf.py

# HTML only. Each extra format (epub, htmlzip) reruns Sphinx over every page,
# which pushed builds past Read the Docs' 15-minute limit.
formats: []

python:
    install:
        - method: pip
          path: .
        - requirements: docs/requirements.txt

submodules:
    include: all